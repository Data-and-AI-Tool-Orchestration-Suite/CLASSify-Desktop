name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"  # 5 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: pip install -e ".[dev,ml,desktop]"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Lint + typecheck
        run: |
          ruff format --check backend desktop tests
          ruff check backend desktop tests
          mypy backend desktop

      - name: Run tests (excludes ML regression + e2e for speed)
        run: pytest tests/backend -m "not ml_regression and not addon and not e2e" --no-cov -q
        env:
          MPLBACKEND: Agg

      - name: Build PyInstaller bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pyinstaller desktop/packaging/pyinstaller/windows.spec --noconfirm
          elif [ "$RUNNER_OS" = "Linux" ]; then
            pyinstaller desktop/packaging/pyinstaller/linux.spec --noconfirm
          else
            pyinstaller desktop/packaging/pyinstaller/macos.spec --noconfirm
          fi

      - name: Smoke test — frozen app boots
        run: |
          python -c "
          import sys, os
          os.environ['CLASSIFY_DATA_DIR'] = os.environ.get('RUNNER_TEMP', '/tmp') + '/classify-nightly'
          sys.path.insert(0, 'backend')
          sys.path.insert(0, 'desktop')
          from classify_api.main import create_app
          app = create_app()
          routes = [r.path for r in app.routes]
          assert '/api/system/health' in routes, 'Health route missing'
          assert '/api/datasets' in routes, 'Datasets route missing'
          print('Smoke test passed: app creates with', len(routes), 'routes')
          "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.os }}
          path: dist/CLASSify/
          retention-days: 7

  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Post summary
        run: |
          echo "## Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| OS | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY

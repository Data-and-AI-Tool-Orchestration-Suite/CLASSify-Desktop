name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build Windows ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: pip install -e ".[dev,ml,desktop]" pyinstaller

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build PyInstaller bundle
        run: pyinstaller desktop/packaging/pyinstaller/windows.spec --noconfirm --distpath dist --workpath build

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "desktop\packaging\installers\windows\classify.iss"

      - name: Compute SHA256
        id: sha
        run: |
          $hash = (Get-FileHash -LiteralPath "dist\installers\CLASSify-Setup-${{ github.ref_name }}-x64.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item -LiteralPath "dist\installers\CLASSify-Setup-${{ github.ref_name }}-x64.exe").Length
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "size=$size" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installers/CLASSify-Setup-*.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installers/CLASSify-Setup-*.exe
          generate_release_notes: true

  # ── Build macOS (universal2) ──
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: pip install -e ".[dev,ml,desktop]" pyinstaller

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build PyInstaller bundle
        run: pyinstaller desktop/packaging/pyinstaller/macos.spec --noconfirm --distpath dist --workpath build

      - name: Create ZIP
        run: |
          cd dist
          zip -r CLASSify-${{ github.ref_name }}-macos.zip CLASSify.app

      - name: Compute SHA256
        id: sha
        run: |
          hash=$(shasum -a 256 "dist/CLASSify-${{ github.ref_name }}-macos.zip" | cut -d' ' -f1)
          size=$(stat -f%z "dist/CLASSify-${{ github.ref_name }}-macos.zip")
          echo "sha256=$hash" >> $GITHUB_OUTPUT
          echo "size=$size" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/CLASSify-*-macos.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CLASSify-*-macos.zip

  # ── Build Linux ──
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev

      - name: Install Python dependencies
        run: pip install -e ".[dev,ml,desktop]" pyinstaller

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build PyInstaller bundle
        run: pyinstaller desktop/packaging/pyinstaller/linux.spec --noconfirm --distpath dist --workpath build

      - name: Create tar.gz
        run: |
          cd dist
          tar czf CLASSify-${{ github.ref_name }}-linux.tar.gz CLASSify

      - name: Compute SHA256
        id: sha
        run: |
          hash=$(sha256sum "dist/CLASSify-${{ github.ref_name }}-linux.tar.gz" | cut -d' ' -f1)
          size=$(stat -c%s "dist/CLASSify-${{ github.ref_name }}-linux.tar.gz")
          echo "sha256=$hash" >> $GITHUB_OUTPUT
          echo "size=$size" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/CLASSify-*-linux.tar.gz

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CLASSify-*-linux.tar.gz

  # ── Generate latest.json manifest ──
  publish-manifest:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json
        env:
          VERSION: ${{ github.ref_name }}
          WIN_SHA: ${{ needs.build-windows.outputs.sha256 }}
          WIN_SIZE: ${{ needs.build-windows.outputs.size }}
          MAC_SHA: ${{ needs.build-macos.outputs.sha256 }}
          MAC_SIZE: ${{ needs.build-macos.outputs.size }}
          LIN_SHA: ${{ needs.build-linux.outputs.sha256 }}
          LIN_SIZE: ${{ needs.build-linux.outputs.size }}
          RELEASE_NOTES: ${{ needs.build-windows.outputs.release_notes }}
        run: |
          REPO="${{ github.repository }}"
          python -c "
          import json, datetime
          manifest = {
              'version': '${{ github.ref_name }}'.lstrip('v'),
              'released_at': datetime.datetime.utcnow().isoformat() + 'Z',
              'channel': 'stable',
              'minimum_upgrade_from': '0.0.0',
              'assets': {
                  'windows-x64': {
                      'url': f'https://github.com/${REPO}/releases/download/${{ github.ref_name }}/CLASSify-Setup-${{ github.ref_name }}-x64.exe',
                      'sha256': '$WIN_SHA',
                      'size': int('$WIN_SIZE'),
                  },
                  'macos-universal2': {
                      'url': f'https://github.com/${REPO}/releases/download/${{ github.ref_name }}/CLASSify-${{ github.ref_name }}-macos.zip',
                      'sha256': '$MAC_SHA',
                      'size': int('$MAC_SIZE'),
                  },
                  'linux-x86_64-appimage': {
                      'url': f'https://github.com/${REPO}/releases/download/${{ github.ref_name }}/CLASSify-${{ github.ref_name }}-linux.tar.gz',
                      'sha256': '$LIN_SHA',
                      'size': int('$LIN_SIZE'),
                  },
              },
              'notes': 'CLASSify Desktop ${{ github.ref_name }}',
          }
          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "

      - name: Upload manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json

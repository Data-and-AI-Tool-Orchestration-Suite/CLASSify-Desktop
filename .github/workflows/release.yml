name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write

jobs:
  # ── Build per OS (parallel) ──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: CLASSify-Setup-${{ github.ref_name }}-x64.exe
          - os: ubuntu-22.04
            platform: linux
            artifact_name: CLASSify-${{ github.ref_name }}-x86_64.AppImage
          - os: macos-14
            platform: macos-arm
            artifact_name: CLASSify-${{ github.ref_name }}-arm64.tar.gz
          - os: macos-13
            platform: macos-intel
            artifact_name: CLASSify-${{ github.ref_name }}-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: pip install -e ".[dev,ml,desktop]"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build PyInstaller bundle (Windows)
        if: matrix.platform == 'windows'
        run: |
          pyinstaller desktop/packaging/pyinstaller/windows.spec --noconfirm
          choco install innosetup -y
          iscc desktop/packaging/installers/windows/classify.iss
        env:
          CLASSIFY_VERSION: ${{ github.ref_name }}

      - name: Build PyInstaller bundle (Linux)
        if: matrix.platform == 'linux'
        run: |
          pyinstaller desktop/packaging/pyinstaller/linux.spec --noconfirm
          chmod +x desktop/packaging/installers/linux/build_appimage.sh
          ./desktop/packaging/installers/linux/build_appimage.sh
        env:
          CLASSIFY_VERSION: ${{ github.ref_name }}

      - name: Build PyInstaller bundle (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          pyinstaller desktop/packaging/pyinstaller/macos.spec --noconfirm
          cd dist/CLASSify && tar czf ../../${{ matrix.artifact_name }} .
        env:
          CLASSIFY_VERSION: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            dist/installers/*
            dist/*.tar.gz
          retention-days: 30

  # ── Sign + Notarize (macOS) ──
  sign-macos:
    needs: build
    runs-on: macos-14
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 + intel builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-macos-*
          merge-multiple: true
          path: dist/

      - name: Import signing certificate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          echo $APPLE_DEVELOPER_ID_P12_BASE64 | base64 --decode > cert.p12
          security create-keychain -p classify build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
          security set-partition-list -S apple-tool:,apple: -s -k classify build.keychain

      - name: Lipo merge + sign + notarize
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CLASSIFY_VERSION: ${{ github.ref_name }}
        run: |
          # Extract both builds
          mkdir -p arm64 intel
          tar xzf dist/CLASSify-${{ github.ref_name }}-arm64.tar.gz -C arm64
          tar xzf dist/CLASSify-${{ github.ref_name }}-x86_64.tar.gz -C intel

          # Lipo merge the main binary + jobworker
          mkdir -p universal
          lipo -create arm64/CLASSify intel/CLASSify -output universal/CLASSify
          lipo -create arm64/classify-jobworker intel/classify-jobworker -output universal/classify-jobworker

          # Copy the rest from arm64 (data files are arch-independent)
          cp -r arm64/* universal/
          cp universal/CLASSify universal/CLASSify
          cp universal/classify-jobworker universal/classify-jobworker

          # Build DMG
          chmod +x desktop/packaging/installers/macos/build_dmg.sh
          APPLE_SIGNING_ID="Developer ID Application: University of Kentucky" \
            ./desktop/packaging/installers/macos/build_dmg.sh

          # Notarize
          mkdir -p ~/.appstoreconnect/private_keys
          echo $APPLE_API_KEY_BASE64 | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          xcrun notarytool submit dist/installers/CLASSify-${{ github.ref_name }}-universal2.dmg \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          # Staple
          xcrun stapler staple dist/installers/CLASSify-${{ github.ref_name }}-universal2.dmg

      - name: Verify
        run: |
          spctl --assess --verbose=4 --type execute dist/installers/CLASSify-${{ github.ref_name }}-universal2.dmg
          codesign --verify --deep --strict dist/installers/CLASSify-${{ github.ref_name }}-universal2.dmg

      - name: Upload signed DMG
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos
          path: dist/installers/CLASSify-${{ github.ref_name }}-universal2.dmg

  # ── Sign Windows ──
  sign-windows:
    needs: build
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: dist/installers/

      - name: Sign installer
        if: env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          [System.IO.File]::WriteAllBytes("cert.pfx", $certBytes)
          $installer = Get-ChildItem dist/installers/CLASSify-Setup-*.exe | Select-Object -First 1
          & signtool sign /f cert.pfx /p "$env:WINDOWS_CERT_PASSWORD" /fd sha256 /td sha256 /tr http://timestamp.digicert.com $installer.FullName
          & signtool verify /pa /v $installer.FullName
        shell: pwsh

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: dist/installers/CLASSify-Setup-*.exe

  # ── Publish release ──
  publish:
    needs: [sign-macos, sign-windows, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Collect release artifacts
        run: |
          mkdir -p release-assets
          find dist/ -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" | while read f; do
            cp "$f" release-assets/
          done

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Generate latest.json
        run: |
          pip install -e ".[dev]"
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/generate_manifest.py \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --output release-assets/latest.json \
            --windows-exe release-assets/CLASSify-Setup-${GITHUB_REF_NAME}-x64.exe \
            --macos-dmg release-assets/CLASSify-${GITHUB_REF_NAME}-universal2.dmg \
            --linux-appimage release-assets/CLASSify-${GITHUB_REF_NAME}-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o release-assets/sbom-python.json
          npx @cyclonedx/cyclonedx-npm --output-file release-assets/sbom-npm.json frontend/package-lock.json || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: release-assets/*

  # ── Post-release verification ──
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets
        run: |
          echo "Verifying release assets are downloadable..."
          # The release is now public — verify the latest.json is accessible
          curl -sL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" | jq .
          echo "Release verification complete."

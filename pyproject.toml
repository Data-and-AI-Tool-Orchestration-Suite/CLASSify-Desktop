[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classify-desktop"
version = "1.0.0"
description = "CLASSify Desktop — local-first ML classification training app"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "UK Center for Applied AI" }]

dependencies = [
    # Web server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Logging
    "structlog>=24.1",
    # Optional encryption
    "cryptography>=43",
    # Keyring (for passphrase storage when encryption on)
    "keyring>=25",
]

[project.optional-dependencies]
ml = [
    # Data / ML (base — no torch)
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "xgboost>=3.0",
    "shap>=0.46",
    "hdbscan>=0.8.39",
    "pyamg>=5.2",
    "numba>=0.60",
    "imbalanced-learn>=0.13",
    "optuna>=4.0",
    "joblib>=1.4",
    "charset-normalizer>=3.3",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "seaborn>=0.13",
    # Reports
    "reportlab>=4.2",
    "xlsxwriter>=3.2",
]
desktop = [
    "pywebview>=5.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pip-tools>=7.4",
    "pre-commit>=3.7",
]
dev-ml = [
    "classify-desktop[dev,ml]",
]
tabpfn = [
    "torch>=2.3",
    "tabpfn>=2.0",
    "huggingface-hub>=0.24",
]
sdv = [
    "torch>=2.3",
    "sdv>=1.13",
]

[project.scripts]
classify = "classify_desktop.__main__:main"
classify-api = "classify_api.main:run"
classify-jobworker = "runner.jobworker:main"

[tool.setuptools.packages.find]
where = ["backend", "desktop"]
include = ["classify_api*", "classify_desktop*", "ml*", "storage*", "runner*"]

# ────────────────────── Ruff ──────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "desktop"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts ok in tests
"migrations/**" = ["E", "F"]  # alembic templates
"backend/classify_api/routers/**" = ["B008"]  # FastAPI File/Depends in defaults

[tool.ruff.format]
quote-style = "double"

# ────────────────────── Mypy ──────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["classify_api", "classify_desktop", "ml", "storage", "runner"]

[[tool.mypy.overrides]]
module = [
    "shap.*", "hdbscan.*", "xgboost.*", "pyamg.*", "numba.*",
    "imblearn.*", "tabpfn.*", "sdv.*", "ctgan.*", "copulas.*",
    "rdt.*", "deepecho.*", "webview.*", "plotly.*", "seaborn.*",
    "reportlab.*", "xlsxwriter.*", "alembic.*", "pandas.*",
    "sklearn.*", "scipy.*", "sdmetrics.*", "matplotlib.*",
    "optuna.*", "joblib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ml.*"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "classify_desktop.*"
disable_error_code = ["import-not-found", "name-defined", "attr-defined"]

# ────────────────────── Pytest ──────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=backend --cov-report=term-missing"
markers = [
    "ml_regression: golden-dataset ML training regression tests (slow)",
    "addon: tests requiring torch-gated addons (TabPFN/SDV)",
    "slow: long-running tests",
    "e2e: end-to-end Playwright tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::FutureWarning:pandas.*",
    "ignore::UserWarning:sklearn.*",
]
